<div class="create-note">
  <div class="form-container">
    <h2>Create New Note</h2>
    
    <form (ngSubmit)="saveNote()">
      <div class="form-group">
        <label for="title">Title</label>
        <input 
          type="text" 
          id="title" 
          [(ngModel)]="title" 
          name="title" 
          placeholder="Enter note title..."
          required>
      </div>
      
      <div class="form-group">
        <label for="content">Content</label>
        <textarea 
          id="content" 
          [(ngModel)]="content" 
          name="content" 
          placeholder="Write your note here..."
          rows="10"
          required></textarea>
      </div>
      
      <div class="form-group">
        <label for="tags">Tags</label>
        <div class="tag-input">
          <input 
            type="text" 
            id="tags" 
            [(ngModel)]="tagInput" 
            name="tagInput" 
            placeholder="Add a tag..."
            (keyup.enter)="addTag()">
          <button type="button" (click)="addTag()">Add</button>
        </div>
        
        <div class="tags-list">
          @for (tag of tags; track tag) {
            <span class="tag">
              {{ tag }}
              <button type="button" (click)="removeTag(tag)" class="remove-tag">×</button>
            </span>
          }
        </div>
      </div>
      
      <div class="form-actions">
        <button type="button" (click)="cancel()" class="cancel-btn">Cancel</button>
        <button type="submit" [disabled]="!title.trim() || !content.trim()" class="save-btn">Save Note</button>
      </div>
    </form>
  </div>
</div>
