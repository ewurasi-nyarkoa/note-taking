<div class="auth-container">
  <div class="auth-card">
    <div class="logo-section">
      <img src="/assetsimages/logo.png" alt="Logo" class="logo">
    </div>
    
    <div class="auth-header">
      <h2>{{ isSignUp ? 'Create Account' : 'Welcome Back' }}</h2>
      <p class="subtitle">{{ isSignUp ? 'Sign up to get started' : 'Sign in to your account' }}</p>
    </div>
    
    <form (ngSubmit)="onSubmit()" #authForm="ngForm" class="auth-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          id="email"
          type="email" 
          [(ngModel)]="email" 
          name="email"
          placeholder="Enter your email"
          required
          class="form-input">
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input 
          id="password"
          type="password" 
          [(ngModel)]="password" 
          name="password"
          placeholder="Enter your password"
          required
          class="form-input">
      </div>
      
      <div class="error" *ngIf="error">{{ error }}</div>
      
      <button 
        type="submit" 
        [disabled]="loading || !authForm.valid"
        class="auth-btn">
        <span *ngIf="loading" class="loading-spinner"></span>
        {{ loading ? 'Loading...' : (isSignUp ? 'Create Account' : 'Sign In') }}
      </button>
    </form>
    
    <div class="divider">
    </div>
    
    <p class="toggle-text">
      {{ isSignUp ? 'Already have an account?' : "Don't have an account?" }}
      <button type="button" (click)="toggleMode()" class="toggle-btn">
        {{ isSignUp ? 'Sign In' : 'Sign Up' }}
      </button>
    </p>
  </div>
</div>
